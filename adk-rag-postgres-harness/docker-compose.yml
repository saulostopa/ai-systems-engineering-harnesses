services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: harness_rag
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness_rag"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
