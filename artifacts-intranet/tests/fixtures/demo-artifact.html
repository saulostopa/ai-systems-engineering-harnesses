<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title data-i18n="title">Harness artifact</title>
<style>
/* ============================================================
   system.css — v2 (Eleanor)
   Tokens do design system Webmotors (webmotors.ds.eleanor.tokens):
   brand red, gray dark scale, indigo complementary, fonte Figtree.
   Acessibilidade: contraste AA, focus-visible, reduced-motion,
   aria-live suportado pelos scripts do skeleton.
   Claro por padrão; escuro via data-theme="dark".
   ============================================================ */

:root {
  /* ── Eleanor primitives ── */
  --wm-red-500: #2563eb;
  --wm-red-400: #3b82f6;
  --wm-red-300: #60a5fa;
  --wm-red-700: #1e3a8a;
  --wm-gray-50: #ffffff;
  --wm-gray-100: #f4f4f8;
  --wm-gray-200: #e4e4ea;
  --wm-gray-300: #d3d3d9;
  --wm-gray-400: #a2a2a9;
  --wm-gray-500: #72727a;
  --wm-gray-600: #515159;
  --wm-gray-700: #3f3f47;
  --wm-gray-800: #262629;
  --wm-gray-900: #171719;
  --wm-gray-950: #0a0a0c;
  --wm-indigo-400: #4c4ca0;
  --wm-indigo-600: #1f1f42;
  --wm-green-500: #2e7d4f;
  --wm-yellow-500: #b98a00;
  --wm-orange-500: #c2410c;

  /* ── Papéis (nome por papel, não por valor) ── */
  --color-accent: var(--wm-red-500);
  --color-accent-strong: var(--wm-red-700);
  --color-accent-soft: rgba(37, 99, 235, 0.12);
  --color-accent-text: var(--wm-red-700);

  --color-bg-canvas: var(--wm-gray-100);
  --color-bg-surface: var(--wm-gray-50);
  --color-bg-sunken: var(--wm-gray-200);
  --color-bg-soft: rgba(37, 99, 235, 0.06);

  --color-text-primary: var(--wm-gray-950);
  --color-text-secondary: var(--wm-gray-700);
  --color-text-muted: var(--wm-gray-500);
  --color-text-on-accent: var(--wm-gray-50);
  --color-border: var(--wm-gray-300);
  --color-border-subtle: var(--wm-gray-200);

  --color-success: var(--wm-green-500);
  --color-success-soft: rgba(46, 125, 79, 0.12);
  --color-success-text: #1d5c3a;
  --color-warning: var(--wm-yellow-500);
  --color-warning-soft: rgba(185, 138, 0, 0.14);
  --color-warning-text: #7a5900;
  --color-danger: var(--wm-red-500);
  --color-danger-soft: rgba(37, 99, 235, 0.12);
  --color-danger-text: var(--wm-red-700);
  --color-info: var(--wm-indigo-400);
  --color-info-soft: rgba(76, 76, 160, 0.12);
  --color-info-text: var(--wm-indigo-600);

  --tier-1: var(--wm-green-500);  --tier-1-soft: rgba(46, 125, 79, 0.12);  --tier-1-text: #1d5c3a;
  --tier-2: var(--wm-indigo-400); --tier-2-soft: rgba(76, 76, 160, 0.12);  --tier-2-text: var(--wm-indigo-600);
  --tier-3: var(--wm-yellow-500); --tier-3-soft: rgba(185, 138, 0, 0.14);  --tier-3-text: #7a5900;
  --tier-4: var(--wm-red-500);    --tier-4-soft: rgba(37, 99, 235, 0.12);  --tier-4-text: var(--wm-red-700);

  /* ── Tipografia (Eleanor: Figtree) ── */
  --font-display: "Figtree", "Inter", system-ui, sans-serif;
  --font-body: "Figtree", "Inter", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --text-xs: 0.75rem;   --text-sm: 0.875rem;  --text-base: 1rem;
  --text-lg: 1.125rem;  --text-xl: 1.375rem;  --text-2xl: 1.75rem;  --text-3xl: 2.25rem;

  /* ── Espaço, raio, elevação ── */
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;
  --radius-xs: 4px; --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-full: 999px;
  --elevation-1: 0 1px 2px rgba(10, 10, 12, 0.08);
  --elevation-2: 0 2px 8px rgba(10, 10, 12, 0.12);
  --elevation-3: 0 12px 32px rgba(10, 10, 12, 0.18);
  --focus-ring: 0 0 0 2px var(--color-bg-surface), 0 0 0 4px var(--color-accent);
}

:root[data-theme="dark"] {
  --color-bg-canvas: var(--wm-gray-950);
  --color-bg-surface: var(--wm-gray-900);
  --color-bg-sunken: var(--wm-gray-800);
  --color-bg-soft: rgba(37, 99, 235, 0.10);
  --color-text-primary: var(--wm-gray-100);
  --color-text-secondary: var(--wm-gray-400);
  --color-text-muted: var(--wm-gray-500);
  --color-border: var(--wm-gray-700);
  --color-border-subtle: var(--wm-gray-800);
  --color-accent: var(--wm-red-400);
  --color-accent-strong: var(--wm-red-300);
  --color-accent-text: var(--wm-red-300);
  --color-text-on-accent: var(--wm-gray-50);
  --color-success-text: #6fcf97;
  --color-warning-text: #e0c040;
  --color-danger-text: var(--wm-red-300);
  --color-info-text: #9c9cc9;
  --tier-1-text: #6fcf97; --tier-2-text: #9c9cc9;
  --tier-3-text: #e0c040; --tier-4-text: var(--wm-red-300);
  --elevation-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 0 0 1px var(--color-border-subtle);
  --elevation-2: 0 2px 8px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--color-border-subtle);
  --elevation-3: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--color-border-subtle);
}

/* ── Base ── */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.6;
  color: var(--color-text-primary);
  background: var(--color-bg-canvas);
  -webkit-font-smoothing: antialiased;
}
code, kbd, samp, pre, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.25; letter-spacing: -0.01em; }
h1 { font-size: var(--text-3xl); } h2 { font-size: var(--text-2xl); } h3 { font-size: var(--text-xl); }
a { color: var(--color-accent-text); text-decoration: underline; text-underline-offset: 2px; }
a:hover { color: var(--color-accent); }

/* Acessibilidade: foco visível em anel (IBM Carbon) */
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-xs); }

/* ── Layout ── */
.wrap { max-width: 860px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-8); }
.header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-6); }
.brand { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-display); font-weight: 700; }
.brand-mark { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--color-accent); color: var(--color-text-on-accent); display: grid; place-items: center; font-weight: 800; }

/* ── Card (única unidade estrutural) ── */
.card {
  background: var(--color-bg-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--elevation-2);
  padding: var(--space-5);
  margin-bottom: var(--space-5);
}
.card h2:first-child, .card h3:first-child { margin-top: 0; }

/* ── Badge / status (3 variantes: sólido, soft, text) ── */
.badge { display: inline-block; padding: 2px 10px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 600; }
.badge-solid { color: var(--color-text-on-accent); }
.badge-soft { color: var(--color-accent-text); background: var(--color-accent-soft); }
.badge-text { color: var(--color-accent-text); }

/* ── Tabelas ── */
table { width: 100%; border-collapse: collapse; margin: var(--space-3) 0; font-size: var(--text-sm); }
th { text-align: left; background: var(--color-bg-sunken); color: var(--color-text-secondary); }
th, td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border-subtle); }
td { font-variant-numeric: tabular-nums; }

/* ── Quiz ── */
.quiz-level { margin-bottom: var(--space-6); }
.quiz-stem { font-weight: 600; margin-bottom: var(--space-2); }
.quiz-opt {
  display: block; width: 100%; text-align: left;
  padding: var(--space-3); margin-bottom: var(--space-2);
  border: 1px solid var(--color-border); border-radius: var(--radius-md);
  background: var(--color-bg-surface); color: var(--color-text-primary);
  font: inherit; cursor: pointer;
}
.quiz-opt:hover:not(:disabled) { border-color: var(--color-accent); }
.quiz-opt:disabled { cursor: default; opacity: 0.85; }
.quiz-opt[data-correct="true"] { background: var(--color-success-soft); border-color: var(--color-success); }
.quiz-opt[aria-pressed="true"][data-correct="false"] { background: var(--color-danger-soft); border-color: var(--color-danger); }
.quiz-why {
  margin: var(--space-2) 0 var(--space-4); padding: var(--space-3);
  background: var(--color-bg-sunken); border-radius: var(--radius-sm);
  font-size: var(--text-sm); color: var(--color-text-secondary);
  display: none;
}
.quiz-why[data-visible="true"] { display: block; }

/* ── Progresso ── */
.progress { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
.progress-bar { flex: 1; height: 8px; border-radius: var(--radius-full); background: var(--color-bg-sunken); overflow: hidden; }
.progress-fill { height: 100%; background: var(--color-accent); border-radius: var(--radius-full); transition: width 0.3s ease; width: 0; }
.progress-label { font-size: var(--text-sm); color: var(--color-text-muted); font-variant-numeric: tabular-nums; }

/* ── Resultado (aria-live) ── */
.result { margin-top: var(--space-5); padding: var(--space-5); border-radius: var(--radius-lg); background: var(--color-bg-soft); border: 1px solid var(--color-accent-soft); }
.result[hidden] { display: none; }
.result h2 { margin-top: 0; }

/* ── Modo revisão (quiz adaptativo) ── */
.review-item { padding: var(--space-4); border: 1px dashed var(--color-border); border-radius: var(--radius-md); margin-bottom: var(--space-3); }

/* ── Rodapé do tema/idioma ── */
.toolbar { display: flex; gap: var(--space-2); align-items: center; }
.toolbar button {
  padding: var(--space-1) var(--space-3); font: inherit; font-size: var(--text-sm);
  border: 1px solid var(--color-border); border-radius: var(--radius-full);
  background: var(--color-bg-surface); color: var(--color-text-secondary); cursor: pointer;
}
.toolbar button:hover { border-color: var(--color-accent); color: var(--color-accent-text); }

/* ── Acessibilidade: movimento reduzido ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ── Impressão ── */
@media print {
  body { background: #fff; color: #000; }
  .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
  .toolbar { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">W</span>
      <span data-i18n="brand">Harness · Webmotors</span>
    </div>
    <div class="toolbar">
      <button type="button" id="lang-toggle" aria-label="Alternar idioma / Toggle language">EN</button>
      <button type="button" id="theme-toggle" aria-label="Alternar tema / Toggle theme">◐</button>
    </div>
  </header>

  <main>
    <!-- ═══ CONTEÚDO DO ARTEFATO ═══
         (gerado mecanicamente por build-demo.py)

    <section class="card" aria-label="O que foi entregue">
      <h2 data-i18n="s1" data-i18n-pt="O que foi entregue" data-i18n-en="What was delivered">O que foi entregue</h2>
      <p>Adicionada validação de e-mail no formulário de busca de concessionárias.</p>
      <p><span class="badge badge-solid">ENTREGUE</span> <span class="badge badge-soft">sem regressão</span></p>
    </section>
    <section class="card" aria-label="Decisões e trade-offs">
      <h2 data-i18n="s2" data-i18n-pt="Decisões e trade-offs" data-i18n-en="Decisions and trade-offs">Decisões e trade-offs</h2>
      <p>Escolhido regex do lado do cliente em vez de validação por API porque o endpoint já existia sem esse contrato, ao custo de duplicar a regra entre clientes.</p>
    </section>
    <section class="card" aria-label="Verificação">
      <h2 data-i18n="s3" data-i18n-pt="Verificação" data-i18n-en="Verification">Verificação</h2>
      <table>
        <thead><tr><th>Comando</th><th>Esperado</th><th>Real</th></tr></thead>
        <tbody>
          <tr><td><code>npm run build</code></td><td>exit 0</td><td>exit 0</td></tr>
          <tr><td><code>npm test</code></td><td>12 testes verdes</td><td>12 verdes (sem redução)</td></tr>
          <tr><td><code>pytest tests/e2e -q</code></td><td>2 verdes</td><td>2 verdes</td></tr>
        </tbody>
      </table>
    </section>
    <section class="card" aria-label="Perguntas abertas">
      <h2 data-i18n="s4" data-i18n-pt="Perguntas abertas" data-i18n-en="Open questions">Perguntas abertas</h2>
      <p>A regra deve migrar para a API quando o contrato existir? Quem decide o limite de formato (ex.: domínios punycode)?</p>
    </section>


    <!-- Quiz dinâmico: as seções .quiz-level são geradas aqui.
         O script abaixo pontua, anuncia por aria-live e oferece
         modo de revisão (itens errados repetidos) quando habilitado. -->
    <section class="card" id="quiz-root" aria-label="Quiz">
      <h2 data-i18n="quiz-title">Verifique seu aprendizado</h2>
      <div class="progress" aria-hidden="true">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="progress-label" id="progress-label">0%</span>
      </div>
      <div id="quiz-levels"><!-- .quiz-level gerados aqui --></div>
      <button type="button" class="quiz-opt" id="submit-quiz" style="font-weight:600;text-align:center" hidden>
        <span data-i18n="submit">Conferir respostas</span>
      </button>
      <div class="result" id="quiz-result" role="status" aria-live="polite" hidden></div>
      <div id="review-root" hidden>
        <h3 data-i18n="review-title">Revisão (questões para reforçar)</h3>
        <div id="review-items"></div>
        <button type="button" class="quiz-opt" id="review-submit" style="font-weight:600;text-align:center">
          <span data-i18n="review-submit">Conferir revisão</span>
        </button>
      </div>
    </section>
  </main>

  <footer style="margin-top:var(--space-7);color:var(--color-text-muted);font-size:var(--text-sm)">
    <span data-i18n="footer">Gerado por skill de harness · Webmotors</span>
  </footer>
</div>

<script>
/* ═══ Skeleton scripts — copiar inteiros, nunca reescrever (skill-design.md) ═══ */

/* Tema */
(function () {
  const btn = document.getElementById("theme-toggle");
  const root = document.documentElement;
  const saved = localStorage.getItem("hsk-theme");
  if (saved) root.dataset.theme = saved;
  btn.addEventListener("click", () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    localStorage.setItem("hsk-theme", root.dataset.theme);
  });
})();

/* Idioma: os atributos data-i18n são trocados por pares data-i18n-pt/en.
   Ex.: <h1 data-i18n="heading" data-i18n-pt="Título" data-i18n-en="Title"> */
(function () {
  const btn = document.getElementById("lang-toggle");
  let lang = localStorage.getItem("hsk-lang") || "pt";
  const apply = () => {
    document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const k = "data-i18n-" + lang;
      if (el.hasAttribute(k)) el.textContent = el.getAttribute(k);
    });
    btn.textContent = lang === "pt" ? "EN" : "PT";
  };
  btn.addEventListener("click", () => { lang = lang === "pt" ? "en" : "pt"; localStorage.setItem("hsk-lang", lang); apply(); });
  apply();
})();

/* Pontuação por nível + progresso + resultado (aria-live) */
function updateLevelScore(level) {
  const opts = level.querySelectorAll(".quiz-opt");
  const correct = level.querySelectorAll('.quiz-opt[data-correct="true"]').length;
  const picked = level.querySelectorAll('.quiz-opt[aria-pressed="true"]').length;
  const score = Math.min(picked, correct);
  const total = opts.length ? 3 : 0;
  const label = level.querySelector(".quiz-level-score");
  if (label) label.textContent = score + "/" + total;
  return { score, total };
}
function updateProgress() {
  const levels = document.querySelectorAll(".quiz-level");
  let done = 0, total = 0;
  levels.forEach((l) => { const s = updateLevelScore(l); done += s.score; total += Math.max(1, s.total); });
  const pct = total ? Math.round((done / total) * 100) : 0;
  const fill = document.getElementById("progress-fill");
  const label = document.getElementById("progress-label");
  if (fill) fill.style.width = pct + "%";
  if (label) label.textContent = pct + "%";
}
function revealResult() {
  const levels = document.querySelectorAll(".quiz-level");
  let correct = 0, total = 0;
  const wrong = [];
  levels.forEach((l) => {
    const opts = l.querySelectorAll(".quiz-opt");
    total += opts.length;
    opts.forEach((o) => {
      o.disabled = true;
      const picked = o.getAttribute("aria-pressed") === "true";
      const isCorrect = o.dataset.correct === "true";
      if (isCorrect && picked) correct++;
      if (picked && !isCorrect) wrong.push({ level: l.dataset.levelLabel, text: l.querySelector(".quiz-stem").textContent, why: l.querySelector(".quiz-why") });
    });
    l.querySelectorAll(".quiz-why").forEach((w) => w.dataset.visible = "true");
  });
  const result = document.getElementById("quiz-result");
  const pct = total ? Math.round((correct / total) * 100) : 0;
  const verdict = pct >= 80 ? "Ótimo" : pct >= 50 ? "Bom, mas revise" : "Revise as fontes e refaça";
  result.innerHTML = "<h2>Resultado: " + verdict + "</h2><p>" + correct + " de " + total + " (" + pct + "%)</p>";
  result.hidden = false;
  /* Modo revisão adaptativo: erradas entram na revisão */
  if (wrong.length) {
    const review = document.getElementById("review-root");
    const items = document.getElementById("review-items");
    items.innerHTML = "";
    wrong.forEach((w, i) => {
      const d = document.createElement("div");
      d.className = "review-item";
      d.innerHTML = "<strong>Q" + (i + 1) + " · " + w.level + "</strong><br>" + w.text;
      items.appendChild(d);
    });
    review.hidden = false;
  }
  document.getElementById("submit-quiz").hidden = true;
}
document.addEventListener("click", (e) => {
  const opt = e.target.closest(".quiz-opt");
  if (!opt) return;
  if (opt.closest("#quiz-levels")) {
    opt.parentElement.querySelectorAll(".quiz-opt").forEach((o) => o.removeAttribute("aria-pressed"));
    opt.setAttribute("aria-pressed", "true");
    updateProgress();
  }
  if (e.target.closest("#submit-quiz")) revealResult();
});
</script>
</body>
</html>
