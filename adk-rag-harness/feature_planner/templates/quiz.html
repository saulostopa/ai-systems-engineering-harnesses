<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <style>$css
$quiz_css</style>
</head>
<body>
<header class="masthead shell">
  <span class="brand" data-en="Pilot evidence">Evidências do piloto</span>
  <nav aria-label="Artefatos">
    <a href="architecture.html" data-en="Architecture">Arquitetura</a><a href="replay.html">Replay</a>
    <a href="faq.html">FAQ</a><a href="quiz.html" aria-current="page">Quiz</a>
  </nav>
</header>
<main class="shell">
  <section class="hero">
    <div><h1 id="quiz-title">$title</h1><p data-en="Test your understanding of the implementation, the product rules and how to verify them.">Teste o que aprendeu sobre a implementação, as regras de negócio e como verificá-las.</p></div>
    <button type="button" class="control" id="language" aria-label="Switch to English">EN</button>
  </section>
  <noscript><p>Ative JavaScript para responder e corrigir o quiz. Enable JavaScript to take and grade the quiz.</p></noscript>
  <div class="quiz-layout" id="quiz-root" hidden>
    <aside class="panel quiz-guide">
      <h2 data-en="Progress">Progresso</h2>
      <p id="quiz-progress-label"></p>
      <progress max="12" value="0" id="quiz-progress" aria-labelledby="quiz-progress-label"></progress>
      <nav id="quiz-level-links" aria-label="Níveis do quiz"></nav>
    </aside>
    <div>
      <form id="quiz-form">
        <div id="quiz-levels"></div>
        <p id="quiz-instructions" data-en="Answer all 12 questions to check your score.">Responda às 12 perguntas para conferir a nota.</p>
        <button type="submit" class="control primary" id="submit-quiz" disabled data-en="Check score">Conferir nota</button>
      </form>
      <section class="panel quiz-result" id="quiz-result" aria-live="polite" hidden></section>
      <section class="panel quiz-result" id="review-root" hidden>
        <h2 data-en="Review your missed questions">Revise as perguntas que errou</h2>
        <form id="review-form">
          <div id="review-items"></div>
          <button type="submit" class="control primary" data-en="Check review">Conferir revisão</button>
          <p id="review-result" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </div>
  <footer class="foot"><span data-en="Invocation">Execução</span> <code>$invocation</code></footer>
</main>
<script type="application/json" id="quiz-data">$data</script>
<script>$script</script>
</body>
</html>
